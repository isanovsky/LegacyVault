[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Versi compiler dikunci ke satu versi agar hasil build sama di semua komputer
# (dosen, teman, CI). Tanpa pin, forge bisa memilih versi berbeda.
solc_version = "0.8.28"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
