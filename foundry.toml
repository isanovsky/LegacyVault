[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Versi compiler dikunci ke satu versi agar hasil build sama di semua komputer
# (dosen, teman, CI). Tanpa pin, forge bisa memilih versi berbeda.
solc_version = "0.8.28"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fuzz]
# Jumlah input acak per fuzz test. Bawaan forge 256; dinaikkan agar pembagian porsi diuji lebih banyak kombinasi.
runs = 1000

# Alamat RPC dan API key dibaca dari .env (tidak ditulis langsung di sini supaya tidak ter-commit).
# Dipakai dengan `--rpc-url sepolia` dan `--verify`. Lihat docs/DEPLOY.md.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
